    <!-- Start: Force trailing slash for Vite base URL -->
    <script type="text/javascript">
      (function() {
        // Vite will replace %BASE% at build time. In dev the literal '%BASE%'
        // may appear; fall back to '/' to avoid malformed requests.
        var base = '%BASE%';
        if (typeof base === 'string' && base.indexOf('%BASE%') !== -1) {
          base = '/';
        }
        var l = window.location;
        try {
          if (base && l.pathname === base.slice(0, -1)) {
            window.location.replace(base + l.search + l.hash);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <!-- End: Force trailing slash for Vite base URL -->
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License (adapted)
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        try {
          // Prevent repeated rewrites which can occur with malicious or
          // malformed query strings (e.g. repeated ~and~ tokens). Only run
          // this rewrite once per session.
          if (sessionStorage.getItem('spa-redirected')) return;
          if (l.search && l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            var newUrl = l.pathname.slice(0, -1) + decoded + l.hash;
            // Only replace if it would change the URL to avoid loops
            if (newUrl !== (l.pathname + l.search + l.hash)) {
              window.history.replaceState(null, null, newUrl);
              sessionStorage.setItem('spa-redirected', '1');
            }
          }
        } catch (e) {
          // Fail silently — do not block page load on script errors
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
