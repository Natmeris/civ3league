<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Civilization 3 Players League</title>
  <meta name="description" content="The premier Civilization III multiplayer league. Rankings, events, and community." />
  <meta name="author" content="CivPlayers League" />

  <meta property="og:title" content="Civilization 3 Players League" />
  <meta property="og:description" content="The premier Civilization III multiplayer league. Rankings, events, and community." />
  <meta property="og:type" content="website" />
  <!-- Use relative paths so the same index.html works when served from
    root or a repo subpath during local preview. The final built HTML will
    have asset URLs adjusted by Vite according to `base`. -->
  <meta property="og:image" content="%BASE%civ3-assets/preview.png" />
  <meta property="og:image:alt" content="Civilization 3 Players League" />
  <link rel="icon" type="image/x-icon" href="%BASE%favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="%BASE%favicon.ico" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Civilization 3 Players League" />
  <meta name="twitter:description" content="The premier Civilization III multiplayer league. Rankings, events, and community." />
  <meta name="twitter:image" content="%BASE%civ3-assets/preview.png" />
    
    <!-- NOTE: removed legacy repo-path trailing-slash redirect inserted for
         GitHub Pages when the site was hosted under /CivPlayers-Civ3-League/.
         Serving from a custom domain uses the root path, so this redirect
         would break local preview and root deployments. -->
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>

  <body>
    <div id="root"></div>
    <!-- Use a relative module path so the dev server and subpath preview both
         resolve correctly (e.g. accessing /CivPlayers-Civ3-League/). Vite will
         still handle module resolution in dev mode. -->
  <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
