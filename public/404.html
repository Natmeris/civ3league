<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CivPlayers Civ3 League</title>
    <script type="text/javascript">
  // Single Page Apps for GitHub Pages
  // MIT License
  // https://github.com/rafgraph/spa-github-pages
  // Keep 0 path segments by default to avoid accidental recursive rewrites
  // when the site is served from a custom domain or the root. If you deploy
  // this site under a repository subpath (e.g. /user/repo/), increase this
  // number to the number of base path segments to preserve.
  var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>

  </body>
</html>
