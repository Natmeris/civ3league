<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CivPlayers Civ3 League</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
  // When serving from a custom domain root (this repo is configured to
  // use civplayersciv3league.com) we must keep 0 path segments. When
  // serving from a GitHub Pages repo subpath (username.github.io/repo)
  // this should be 1. Set to 0 for custom domain.
  var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
